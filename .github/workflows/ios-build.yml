name: YASHSWI iOS Compile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-ios:
    name: Compile on macOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d YASHSWI.xcodeproj
          xcodebuild -list -project YASHSWI.xcodeproj

      - name: Compile iOS Simulator application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project YASHSWI.xcodeproj \
            -scheme YASHSWI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/YASHSWI-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/yashswi-build.log"

      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YASHSWI-build-logs
          path: ${{ runner.temp }}/yashswi-build.log
          if-no-files-found: ignore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YASHSWI-simulator-app
          path: ${{ runner.temp }}/YASHSWI-DerivedData/Build/Products/Debug-iphonesimulator/*.app/
          if-no-files-found: warn