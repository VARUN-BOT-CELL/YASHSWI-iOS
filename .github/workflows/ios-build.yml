name: YASHSWI iOS Compile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-ios:
    name: Compile on macOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d YASHSWI.xcodeproj
          xcodebuild -list -project YASHSWI.xcodeproj

      - name: Compile iOS Simulator application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project YASHSWI.xcodeproj \
            -scheme YASHSWI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/YASHSWI-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/yashswi-build.log"

      - name: Package app for Appetize
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/YASHSWI-DerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH="$APP_DIR/YASHSWI.app"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/YASHSWI"

          cd "$APP_DIR"
          /usr/bin/zip -qry "$RUNNER_TEMP/YASHSWI-Appetize.zip" YASHSWI.app

          echo "Appetize ZIP created"
          unzip -l "$RUNNER_TEMP/YASHSWI-Appetize.zip" | head -25

      - name: Upload Appetize package
        uses: actions/upload-artifact@v4
        with:
          name: YASHSWI-Appetize-Package
          path: ${{ runner.temp }}/YASHSWI-Appetize.zip
          if-no-files-found: error
      - name: Run Keychain diagnostics
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project YASHSWI.xcodeproj \
            -scheme YASHSWI \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/yashswi-keychain-test.log"

      - name: Upload Keychain diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YASHSWI-Keychain-Diagnostic
          path: ${{ runner.temp }}/yashswi-keychain-test.log
          if-no-files-found: ignore
      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YASHSWI-build-logs
          path: ${{ runner.temp }}/yashswi-build.log
          if-no-files-found: ignore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YASHSWI-simulator-app
          path: ${{ runner.temp }}/YASHSWI-DerivedData/Build/Products/Debug-iphonesimulator/*.app/
          if-no-files-found: warn