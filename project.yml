name: YASHSWI

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  YASHSWI:
    type: application
    platform: iOS

    sources:
      - path: ios_native_app_v2
        includes:
          - "**/*.swift"
        excludes:
          - "**/*.backup.swift"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashswi.employee
        INFOPLIST_FILE: ios_native_app_v2/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  YASHSWITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YASHSWITests
    dependencies:
      - target: YASHSWI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"